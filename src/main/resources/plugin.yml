name: ParkourEngine
version: '1.0.0'
main: dev.maghreb.parkour.ParkourPlugin
api-version: '1.21'
description: High-performance Parkour Engine with checkpoint tracking and leaderboards
authors: [ MrVoidx ]

commands:
  parkour:
    description: Main parkour command
    usage: /parkour <help>
    aliases: [ pk ]

permissions:
  parkour.admin:
    description: Access to administrative parkour commands
    default: op
  parkour.play:
    description: Access to play parkour courses
    default: true
